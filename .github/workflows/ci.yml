name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Every Monday at 06:00 UTC — see the scheduled-sdk-check job below.
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  # Deny rustdoc warnings in every job: `cargo doc`, the workspace
  # doc-test step, and any rustdoc invocation added later. Scoped to
  # the workflow rather than one step so a new doc invocation cannot
  # start passing CI while rustdoc is warning.
  RUSTDOCFLAGS: -D warnings

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # wasm32v1-none is needed by the CLI's integration tests, which
          # build examples/vault to a real .wasm to test `limits` against.
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
      # Every test run goes through test-no-network.sh, which fetches
      # locked dependencies and then drops the network with
      # `unshare --net`: the suite must pass with no network access
      # (BUILD_SPEC.md §3, CONTRIBUTING.md scope).
      #
      # The suite is split into two explicit steps rather than one
      # generic workspace test run: doc tests execute as their own
      # step so README examples (include_str!'d into the crate docs)
      # cannot be silently dropped — `--all-targets` skips doctests
      # entirely.
      - name: unit + integration tests (network disabled)
        run: bash .github/scripts/test-no-network.sh all-targets
      - name: doc tests — README examples (network disabled)
        run: bash .github/scripts/test-no-network.sh doc

  doc:
    name: cargo doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Warnings are denied via the workflow-level RUSTDOCFLAGS above.
      # Avoid concurrent rustdoc writers racing in shared target/doc metadata.
      - run: cargo doc --workspace --no-deps -j 1

  issue-templates:
    name: issue template metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Parses every form in .github/ISSUE_TEMPLATE and fails with the file
      # and field that is invalid. No Rust toolchain is needed.
      - run: bash .github/scripts/check-issue-templates.sh

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  coverage:
    name: code coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          # llvm-tools must be in place before the network is removed —
          # cargo-llvm-cov would otherwise try to install it from inside
          # the namespace and fail.
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      # The integration suite invokes the built contract as actual WASM. Compile
      # it before llvm-cov sets native-only instrument-coverage rustflags.
      # The test reuses this fixture rather than recompiling inside llvm-cov.
      - name: Prepare uninstrumented WASM fixture
        run: cargo build -p vault --target wasm32v1-none --release --locked
      - name: coverage (network disabled)
        run: bash .github/scripts/test-no-network.sh coverage
      - uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  scheduled-sdk-check:
    name: scheduled test against latest soroban-sdk
    # Runs weekly against whatever soroban-sdk version crates.io currently
    # considers latest, independent of the pinned version in Cargo.toml, so a
    # breaking upstream release is caught before a contributor hits it in a
    # PR. Also runnable on demand from the Actions tab.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - name: Update soroban-sdk to the latest stable release
        run: cargo update -p soroban-sdk
      - run: cargo build --workspace
      - name: full suite against the latest SDK (network disabled)
        run: bash .github/scripts/test-no-network.sh full
      - name: Open an issue if the scheduled run fails
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Scheduled latest-SDK test failed (run ${context.runId})`,
              body: `The weekly test against the latest stable soroban-sdk failed. See the run for details: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['ci', 'upstream-sdk'],
            });
  # add validation coverage for the recurring contract
  # add validation coverage for the batch payout auth model

  # add a line-count and coverage comparison to validation

  # add benchmark tracking for TestEnv construction
