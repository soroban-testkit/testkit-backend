name: Docs

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: changelog + process docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Required process docs exist
        run: |
          for f in CHANGELOG.md API_STABILITY.md COMPATIBILITY.md RELEASING.md; do
            test -f "$f" || { echo "missing required process doc: $f"; exit 1; }
          done

      - name: CHANGELOG has an entry for the current version or Unreleased
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if ! grep -Eq "^## \[$version\]" CHANGELOG.md; then
            if ! grep -Eq "^## \[Unreleased\]" CHANGELOG.md; then
              echo "CHANGELOG.md needs a \"## [$version]\" or \"## [Unreleased]\" heading (workspace version is $version)."
              exit 1
            fi
          fi

      - name: Compatibility matrix documents the pinned soroban-sdk version without stale claims
        run: |
          sdk="$(sed -n 's/^soroban-sdk = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          grep -Fq "soroban-sdk" COMPATIBILITY.md \
            || { echo "COMPATIBILITY.md does not mention soroban-sdk."; exit 1; }
          grep -Fq "$sdk" COMPATIBILITY.md \
            || { echo "COMPATIBILITY.md does not list the pinned soroban-sdk version ($sdk); update it in the same commit as the pin."; exit 1; }
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          grep -Fq "$version" COMPATIBILITY.md \
            || { echo "COMPATIBILITY.md does not list the current workspace version ($version)."; exit 1; }
          grep -Fq "\"=$sdk\"" COMPATIBILITY.md \
            || { echo "COMPATIBILITY.md should show the exact pin \"=$sdk\" in its pinning example; update it with the pin."; exit 1; }

      - name: Minor releases have an API migration guide section
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          patch="${version##*.}"
          if [ "$patch" = "0" ]; then
            test -f MIGRATION.md || { echo "MIGRATION.md is missing; minor release $version needs an API migration guide."; exit 1; }
            grep -Fxq "## $version" MIGRATION.md \
              || { echo "MIGRATION.md has no \"## $version\" heading. Add the migration notes for this minor release."; exit 1; }
          fi
          spec="$(sed -n 's/^soroban-spec = "\(.*\)"/\1/p' crates/cli/Cargo.toml | head -1)"
          if [ -n "$spec" ] && [ "$spec" != "$sdk" ]; then
            echo "crates/cli/Cargo.toml pinned soroban-spec ($spec) does not match workspace soroban-sdk ($sdk); update both on SDK bump."; exit 1;
          fi

      - name: README links the process docs
        run: |
          for f in CHANGELOG.md API_STABILITY.md COMPATIBILITY.md RELEASING.md; do
            grep -Fq "$f" README.md \
              || { echo "README.md should link $f so users can find it."; exit 1; }
          done

      - name: CONTRIBUTING documents the versioning policy
        run: |
          grep -Fq "API_STABILITY.md" CONTRIBUTING.md \
            || { echo "CONTRIBUTING.md should reference API_STABILITY.md."; exit 1; }
          grep -Fq "CHANGELOG.md" CONTRIBUTING.md \
            || { echo "CONTRIBUTING.md should reference CHANGELOG.md."; exit 1; }

      - name: crates.io repository metadata matches the repository URL
        run: |
          expected="https://github.com/soroban-testkit/soroban-testkit"
          workspace_repo="$(sed -n 's/^repository = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$workspace_repo" != "$expected" ]; then
            echo "[workspace.package] repository is \"$workspace_repo\" but the repository URL is \"$expected\"."
            echo "crates.io would link both published crates to the wrong place — update Cargo.toml."
            exit 1
          fi
          for crate in crates/testkit crates/cli; do
            if ! grep -Eq '^repository\.workspace = true$' "$crate/Cargo.toml"; then
              echo "$crate/Cargo.toml must inherit the workspace repository with repository.workspace = true,"
              echo "otherwise its crates.io page would not link to $expected."
              exit 1
            fi
          done
          offenders="$(grep -Fn 'https://github.com/' CHANGELOG.md | grep -Fv "$expected" || true)"
          if [ -n "$offenders" ]; then
            echo "CHANGELOG.md links to a GitHub repository other than $expected:"
            echo "$offenders"
            exit 1
          fi